<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo da Inclusão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one column on phones; on wide screens the start screen splits into text and art, and each adventure splits into the scene (left) and the three choices (right). */
:root{
  --sky:#DDF0FF; --ink:#1D2B53; --ink-2:#47568A; --paper:#FFFFFF;
  --sun:#FFC93C; --sun-soft:#FFF1C2; --grass:#2FB36F; --grass-soft:#D5F5E3; --grass-deep:#1E9A63;
  --coral:#FF6B6B; --coral-soft:#FFE3E1; --blue:#2F8CFF; --blue-soft:#DCEBFF; --grape:#7C5CFA; --grape-soft:#E9E2FF;
  --font-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Lexend','Verdana',system-ui,sans-serif;
  --lift:0 6px 0 var(--ink);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0;background:var(--sky);color:var(--ink);
  font-family:var(--font-body);font-size:18px;line-height:1.5;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
h2[tabindex]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.no-tts [data-say]{display:none}

.card{border:3px solid var(--ink);border-radius:28px;background:var(--paper);box-shadow:var(--lift);overflow:hidden}
.card svg{display:block;width:100%;height:auto}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1;
  padding:16px 28px;background:var(--sun);color:var(--ink);
  border:3px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);
  transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.go{background:var(--grass)}
.chip{
  display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:1rem;
  padding:9px 16px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);
}
.chip:hover{background:var(--blue-soft)}
.chip svg{width:22px;height:22px;flex:none}

/* start */
.start{display:grid;gap:28px;align-items:center;padding-block:8px}
.intro{display:grid;gap:18px;justify-items:start}
.h1-small{display:block;font-size:clamp(1.6rem,5vw,2.4rem);color:var(--ink-2);font-weight:600}
.h1-big{display:inline-block;position:relative;font-size:clamp(3rem,12vw,5.6rem);letter-spacing:.005em}
.squig{position:absolute;left:0;bottom:-8px;width:100%;height:12px}
.lead{font-size:1.15rem;max-width:34em}
.actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hint{color:var(--ink-2);font-size:1rem}
@media(min-width:860px){
  .start{grid-template-columns:1fr 1fr;gap:48px}
  .start .art{order:2}
}

/* play */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:18px}
.kicker{font-family:var(--font-display);font-weight:600;font-size:1.1rem;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase}
.stars{display:flex;gap:4px}
.star svg{width:clamp(22px,6.5vw,30px);height:auto;aspect-ratio:1;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;fill:transparent;stroke-dasharray:3 2;opacity:.6}
.star.got svg{fill:var(--sun);stroke-dasharray:none;opacity:1}
.star.done svg{fill:var(--sun-soft);stroke-dasharray:none;opacity:1}
.star.now svg{fill:var(--paper);stroke-dasharray:none;opacity:1;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.stage{display:grid;gap:20px}
@media(min-width:900px){.stage{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:start}}
.story{display:grid;gap:12px;margin-top:20px;justify-items:start}
.story h2{font-size:clamp(1.8rem,5vw,2.5rem)}
.situation{font-size:clamp(1.1rem,2.6vw,1.3rem);line-height:1.6;max-width:36em}
.ask{font-size:1.35rem;margin-bottom:16px}
.options{display:grid;gap:18px}
.opt{
  position:relative;display:grid;grid-template-columns:76px 1fr;align-items:center;gap:16px;
  width:100%;min-height:96px;padding:10px 16px 10px 10px;text-align:left;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);
  font-weight:600;font-size:clamp(1rem,2.4vw,1.12rem);line-height:1.35;
  transition:transform .12s,box-shadow .12s,background .12s;
}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .ico{width:76px;height:76px;padding:6px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center}
.opt .ico svg{width:100%;height:100%}
.c0 .ico{background:var(--blue-soft)}
.c1 .ico{background:var(--coral-soft)}
.c2 .ico{background:var(--grape-soft)}
.opt.is-wrong{background:#EEF0F6;color:var(--ink-2);box-shadow:0 2px 0 var(--ink);transform:translateY(3px)}
.opt.is-wrong .ico{filter:grayscale(1);opacity:.65}
.opt.is-right{background:var(--grass-soft);box-shadow:0 5px 0 var(--grass-deep)}
.opt.is-other{background:#F4F6FA;color:var(--ink-2)}
.opt.is-other .ico{filter:grayscale(.6);opacity:.7}
.mark{position:absolute;top:-14px;right:-8px;width:38px;height:38px}
.mark svg{width:100%;height:100%}
.feedback{margin-top:22px;padding:18px 20px;border:3px solid var(--ink);border-radius:24px;display:grid;gap:12px;animation:rise .25s ease-out}
.feedback.ok{background:var(--grass-soft)}
.feedback.try{background:var(--sun-soft)}
.fb-head{display:flex;align-items:center;gap:12px}
.fb-head h3{font-size:1.5rem}
.fb-ico{width:44px;height:44px;flex:none}
.tip{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:1rem}
.fb-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* end */
.end{display:grid;gap:26px}
.score{display:grid;gap:14px;justify-items:start}
.score h2{font-size:clamp(2rem,6vw,3.2rem)}
.big-stars{display:flex;flex-wrap:wrap;gap:8px}
.big-stars .star svg{width:clamp(34px,9vw,48px)}
.found{font-size:1.5rem}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin:0;padding:0;list-style:none}
.tool{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border:3px solid var(--ink);border-radius:20px;background:var(--paper)}
.tool .ico{width:64px;height:64px;padding:5px;border:3px solid var(--ink);border-radius:16px;background:var(--blue-soft)}
.tool .ico svg{display:block;width:100%;height:100%}
.t-name{display:block;font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.t-desc{display:block;font-size:.95rem;color:var(--ink-2);line-height:1.4}

#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
#confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r));opacity:.9}}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<div class="wrap">

  <section id="start" class="start">
    <div class="art card" id="heroArt"></div>
    <div class="intro">
      <h1><span class="h1-small">Jogo da</span><span class="h1-big">Inclusão<svg class="squig" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M2 8 Q14 0 26 8 T50 8 T74 8 T98 8 T122 8 T146 8 T170 8 T198 8" fill="none" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/></svg></span></h1>
      <p class="lead">Sete amigos precisam da sua ajuda. Escolha a melhor forma de ajudar cada um e descubra como a escola fica boa para todo mundo.</p>
      <div class="actions">
        <button class="btn go" id="go" type="button">Começar</button>
        <button class="chip" type="button" data-say="intro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3,9 8,9 13,5 13,19 8,15 3,15" fill="currentColor"/><path d="M17 8.5 Q20 12 17 15.5"/></svg>Ouvir</button>
      </div>
      <p class="hint">Errou? Sem problema. É só tentar outra vez.</p>
    </div>
  </section>

  <section id="play" hidden>
    <div class="topbar">
      <p class="kicker" id="kicker"></p>
      <div class="stars" id="stars" role="img"></div>
    </div>
    <div class="stage">
      <div class="left">
        <div class="card" id="scene"></div>
        <div class="story">
          <h2 id="who" tabindex="-1"></h2>
          <p class="situation" id="situation"></p>
          <button class="chip" type="button" data-say="story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3,9 8,9 13,5 13,19 8,15 3,15" fill="currentColor"/><path d="M17 8.5 Q20 12 17 15.5"/></svg>Ouvir a história</button>
        </div>
      </div>
      <div class="right">
        <h3 class="ask">Como você ajuda?</h3>
        <div class="options" id="options" role="group" aria-label="Escolha uma opção"></div>
        <div id="feedback" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
  </section>

  <section id="end" class="end" hidden>
    <div class="score">
      <div class="big-stars" id="bigStars" role="img"></div>
      <h2 id="endTitle" tabindex="-1"></h2>
      <p class="lead" id="endText"></p>
      <div class="actions">
        <button class="btn" type="button" id="again">Jogar de novo</button>
        <button class="chip" type="button" data-say="end"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3,9 8,9 13,5 13,19 8,15 3,15" fill="currentColor"/><path d="M17 8.5 Q20 12 17 15.5"/></svg>Ouvir</button>
      </div>
    </div>
    <h3 class="found">O que você descobriu</h3>
    <ul class="tools" id="tools"></ul>
  </section>

</div>
<div id="confetti" aria-hidden="true"></div>

<script>
(function(){
'use strict';

var INK='#1D2B53', CORAL='#FF6B6B', SUN='#FFC93C', BLUE='#2F8CFF', GRASS='#2FB36F', GRAPE='#7C5CFA';
var S='stroke="'+INK+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';

/* ---------- characters ---------- */
function hairSvg(st,c){
  var cap='<path d="M-19.5 -88 C-22 -113 22 -113 19.5 -88 C13 -98.5 -13 -98.5 -19.5 -88Z" fill="'+c+'"/>';
  if(st==='long') return {back:'<rect x="-23" y="-100" width="46" height="46" rx="20" fill="'+c+'"/>',front:cap};
  if(st==='curly'){
    var pts=[[-16,-101],[-6,-108],[6,-108],[16,-101],[-20,-92],[20,-92]];
    return {back:'',front:pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(Math.abs(p[0])>18?6:8)+'" fill="'+c+'"/>';}).join('')+cap};
  }
  if(st==='buns') return {back:'',front:'<circle cx="-15" cy="-109" r="8.5" fill="'+c+'"/><circle cx="15" cy="-109" r="8.5" fill="'+c+'"/>'+cap};
  return {back:'',front:cap};
}
function legsSvg(pants,skin,prosth){
  var u='<ellipse cx="0" cy="1" rx="26" ry="5" fill="rgba(29,43,83,.14)"/>';
  if(prosth){
    u+='<rect x="-12" y="-36" width="10" height="36" rx="5" fill="'+skin+'"/>';
    u+='<rect x="3" y="-30" width="7" height="26" fill="#A7B3C6" stroke="'+INK+'" stroke-width="1.5"/>';
    u+='<circle cx="6.5" cy="-20" r="5" fill="#DDE4F0" stroke="'+INK+'" stroke-width="1.5"/>';
    u+='<rect x="-13" y="-38" width="12" height="16" rx="5" fill="'+pants+'"/><rect x="1" y="-38" width="12" height="16" rx="5" fill="'+pants+'"/>';
    u+='<path d="M0 -4 L12 -4 Q17 -4 17 0 L0 0Z" fill="'+INK+'"/><ellipse cx="-8" cy="-1" rx="9" ry="4.5" fill="'+INK+'"/>';
  } else {
    u+='<rect x="-12" y="-36" width="10" height="36" rx="5" fill="'+pants+'"/><rect x="2" y="-36" width="10" height="36" rx="5" fill="'+pants+'"/>';
    u+='<ellipse cx="-8" cy="-1" rx="9" ry="4.5" fill="'+INK+'"/><ellipse cx="8" cy="-1" rx="9" ry="4.5" fill="'+INK+'"/>';
  }
  return {under:u,over:''};
}
function chairSvg(pants){
  var u='<ellipse cx="0" cy="1" rx="38" ry="5" fill="rgba(29,43,83,.14)"/>'+
    '<path d="M-24 -48 L-27 -92" stroke="#5B6B93" stroke-width="5" stroke-linecap="round" fill="none"/>'+
    '<line x1="26" y1="-44" x2="38" y2="-12" stroke="#5B6B93" stroke-width="4" stroke-linecap="round"/>'+
    '<circle cx="38" cy="-8" r="8" fill="#8FA0C2" stroke="'+INK+'" stroke-width="3"/>'+
    '<rect x="-26" y="-50" width="54" height="8" rx="4" fill="#5B6B93"/>'+
    '<rect x="-6" y="-64" width="38" height="14" rx="7" fill="'+pants+'"/>'+
    '<rect x="21" y="-62" width="13" height="44" rx="6.5" fill="'+pants+'"/>'+
    '<rect x="26" y="-17" width="22" height="4" rx="2" fill="#5B6B93"/>'+
    '<ellipse cx="38" cy="-20" rx="10" ry="4.5" fill="'+INK+'"/>';
  var o='<circle cx="-8" cy="-26" r="25" fill="rgba(255,255,255,.35)" stroke="'+INK+'" stroke-width="5"/>'+
    '<circle cx="-8" cy="-26" r="17" fill="none" stroke="#8FA0C2" stroke-width="2"/>'+
    '<circle cx="-8" cy="-26" r="4" fill="'+INK+'"/>';
  return {under:u,over:o};
}
function kid(c,o){
  var a=Object.assign({x:0,y:214,s:1,flip:false,mood:'smile',arms:'dd',chair:false,prosth:false,cane:false,phones:false,badge:false},c,o||{});
  var pants=a.pants||'#3B4F7D', style=a.style||'short', skin=a.skin, shirt=a.shirt;
  var dy=a.chair?-14:0;
  var hr=hairSvg(style,a.hair);
  var low=a.chair?chairSvg(pants):legsSvg(pants,skin,a.prosth);
  var mouth=a.mood==='open'
    ?'<ellipse cx="0" cy="-79" rx="5" ry="4.4" fill="'+INK+'"/>'
    :a.mood==='think'
      ?'<path d="M-4 -79.5 Q0 -81.5 4 -79.5" fill="none" stroke="'+INK+'" stroke-width="2.4" stroke-linecap="round"/><path d="M-11 -97 L-3 -95.5 M11 -97 L3 -95.5" stroke="'+INK+'" stroke-width="2" stroke-linecap="round"/>'
      :'<path d="M-6.5 -81 Q0 -74.5 6.5 -81" fill="none" stroke="'+INK+'" stroke-width="2.4" stroke-linecap="round"/>';
  function arm(side,t){
    var sx=side*16, sy=-66;
    var ends={d:[side*24,-38],u:[side*29,-96],f:[side*42,-58]};
    var e=ends[t]; var mx=sx+(e[0]-sx)*.45, my=sy+(e[1]-sy)*.45;
    return '<line x1="'+sx+'" y1="'+sy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="'+skin+'" stroke-width="9" stroke-linecap="round"/>'+
           '<line x1="'+sx+'" y1="'+sy+'" x2="'+mx+'" y2="'+my+'" stroke="'+shirt+'" stroke-width="12" stroke-linecap="round"/>';
  }
  var torso='<rect x="-17" y="-74" width="34" height="44" rx="14" fill="'+shirt+'"/>'+
    (a.badge?'<polygon points="0,-62 2.2,-56.5 8,-56 3.5,-52 5,-46 0,-49.5 -5,-46 -3.5,-52 -8,-56 -2.2,-56.5" fill="#fff"/>':'');
  var head='<circle cx="-19" cy="-87" r="4.2" fill="'+skin+'"/><circle cx="19" cy="-87" r="4.2" fill="'+skin+'"/>'+
    '<circle cx="0" cy="-88" r="19" fill="'+skin+'"/>'+
    '<circle cx="-6.5" cy="-90" r="2.4" fill="'+INK+'"/><circle cx="6.5" cy="-90" r="2.4" fill="'+INK+'"/>'+
    '<circle cx="-11.5" cy="-83.5" r="3.2" fill="#FF8FA3" opacity=".5"/><circle cx="11.5" cy="-83.5" r="3.2" fill="#FF8FA3" opacity=".5"/>'+mouth;
  var phones=a.phones?'<path d="M-20 -90 A20 20 0 0 1 20 -90" fill="none" stroke="'+INK+'" stroke-width="4.5" stroke-linecap="round"/>'+
    '<rect x="-26" y="-97" width="9" height="17" rx="4.5" fill="'+CORAL+'" stroke="'+INK+'" stroke-width="2"/>'+
    '<rect x="17" y="-97" width="9" height="17" rx="4.5" fill="'+CORAL+'" stroke="'+INK+'" stroke-width="2"/>':'';
  var cane=a.cane?'<line x1="42" y1="-58" x2="64" y2="-2" stroke="'+INK+'" stroke-width="6.5" stroke-linecap="round"/>'+
    '<line x1="42" y1="-58" x2="64" y2="-2" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>'+
    '<line x1="60.5" y1="-11" x2="64" y2="-2" stroke="'+CORAL+'" stroke-width="3.5" stroke-linecap="round"/>':'';
  return '<g transform="translate('+a.x+' '+a.y+') scale('+(a.flip?-a.s:a.s)+' '+a.s+')">'+low.under+
    '<g transform="translate(0 '+dy+')">'+hr.back+torso+arm(-1,a.arms.charAt(0))+arm(1,a.arms.charAt(1))+head+hr.front+phones+cane+'</g>'+low.over+'</g>';
}

var P={
  you:{skin:'#E8B48A',shirt:'#FFC93C',hair:'#5A3A22',style:'short',badge:true},
  leo:{skin:'#A86B45',shirt:'#2F8CFF',hair:'#1A1A1A',style:'curly',chair:true},
  bia:{skin:'#7A4B30',shirt:'#FF6B6B',hair:'#1A1A1A',style:'buns'},
  davi:{skin:'#F2C7A5',shirt:'#2FB36F',hair:'#D9A441',style:'short'},
  mia:{skin:'#D99A6C',shirt:'#7C5CFA',hair:'#3B2314',style:'long'},
  caio:{skin:'#8D5A3B',shirt:'#FF9F45',hair:'#1A1A1A',style:'short',phones:true},
  theo:{skin:'#E8B48A',shirt:'#22BFC4',hair:'#8B4A2B',style:'short',prosth:true},
  lia:{skin:'#FFDDBA',shirt:'#FF7AB6',hair:'#C2552A',style:'curly'},
  ana:{skin:'#D99A6C',shirt:'#FF9F45',hair:'#2B1B12',style:'buns'},
  nico:{skin:'#C98B5E',shirt:'#7C5CFA',hair:'#1A1A1A',style:'short'}
};

/* ---------- scene pieces ---------- */
function cloud(x,y,s){s=s||1;return '<g transform="translate('+x+' '+y+') scale('+s+')" fill="#fff"><ellipse cx="0" cy="0" rx="28" ry="12"/><ellipse cx="-14" cy="-8" rx="14" ry="11"/><ellipse cx="10" cy="-11" rx="16" ry="13"/></g>';}
function sky(){return '<rect width="480" height="240" fill="#BFE3FF"/><circle cx="430" cy="44" r="32" fill="none" stroke="#FFD84D" stroke-width="3" opacity=".5"/><circle cx="430" cy="44" r="24" fill="#FFD84D"/>'+cloud(70,50)+cloud(250,34,.8);}
function grass(){return '<rect y="190" width="480" height="50" fill="#7ED6A0"/><rect y="190" width="480" height="5" fill="#5CC089"/>';}
function tree(x){var y=190;return '<rect x="'+(x-5)+'" y="'+(y-48)+'" width="10" height="50" rx="3" fill="#8B5E3C"/><circle cx="'+x+'" cy="'+(y-62)+'" r="26" fill="#3FB871"/><circle cx="'+(x-16)+'" cy="'+(y-48)+'" r="16" fill="#3FB871"/><circle cx="'+(x+16)+'" cy="'+(y-48)+'" r="16" fill="#3FB871"/>';}

   {icon:'power',label:'Desligar o computador dele',ok:false,why:'O leitor de tela deixa o Caio fazer a atividade sozinho. Mexer sem pedir atrapalha.'},

  ],
  tip:'Cuide do barulho para ajudar quem ouve o computador.',

 {who:'O Théo e o pega-pega',scene:scene6,

  ],
  tip:'Combine as regras junto com a pessoa.',
  tool:{name:'Regras combinadas',desc:'Brincadeiras em que todo mundo participa, do seu jeito.',icon:'together'}},
 {who:'A Lia e o cartaz',scene:scene7,
  alt:'Lia coça a cabeça diante de um cartaz cheio de texto, sem entender. Um colega está ao lado dela.',
  text:'A Lia tem dificuldade para entender o cartaz da escola. O texto é bem comprido e cheio de palavras difíceis.',

   {icon:'book',label:'Ler junto com ela e explicar com palavras fáceis',ok:true,why:'Ler junto, com palavras simples e sem pressa, ajuda a Lia a entender o cartaz.'},
   {icon:'fast',label:'Ler tudo bem rápido e sair andando',ok:false,why:'Rápido demais deixa a Lia perdida. Vale ir devagar e conversar sobre o que está escrito.'}
  ],
  tip:'Explique com calma e palavras simples.',

/* ---------- state and rendering ---------- */
var $=function(s){return document.querySelector(s);};
var state={i:0,res:[],tries:0,solved:false,order:[],fb:''};
var PRAISE=['Isso mesmo!','Muito bem!','Perfeito!','Boa escolha!','Você é demais!','Que legal!','Parabéns!'];
var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 16.5,14.5 18.5,22 12,18 5.5,22 7.5,14.5 2,9.5 9,9"/></svg>';
var CHECK='<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="'+GRASS+'" stroke="'+INK+'" stroke-width="3"/><path d="M12 23 L19 30 L32 15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var THINK='<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="'+SUN+'" stroke="'+INK+'" stroke-width="3"/><text x="22" y="30" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="26" fill="'+INK+'">?</text></svg>';
var SPEAKER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3,9 8,9 13,5 13,19 8,15 3,15" fill="currentColor"/><path d="M17 8.5 Q20 12 17 15.5"/></svg>';
var BAD='<span class="mark" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="'+CORAL+'" stroke="'+INK+'" stroke-width="3"/><path d="M12 12 L24 24 M24 12 L12 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></span>';
var GOOD='<span class="mark" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="'+GRASS+'" stroke="'+INK+'" stroke-width="3"/><path d="M10 19 L16 25 L27 12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

function svgBox(inner,label){return '<svg viewBox="0 0 480 240" role="img" aria-label="'+label+'">'+inner+'</svg>';}
function top(){try{window.scrollTo({top:0,behavior:'auto'});}catch(e){}}
function reduced(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function show(v){['start','play','end'].forEach(function(id){$('#'+id).hidden=(id!==v);});top();}

function renderStars(){
  var n=0;
  var html=Q.map(function(_,k){
    var r=state.res[k]; if(r==='first') n++;
    var cls=r==='first'?'got':r==='retry'?'done':(k===state.i?'now':'todo');
    return '<span class="star '+cls+'">'+STAR+'</span>';
  }).join('');
  var el=$('#stars'); el.innerHTML=html; el.setAttribute('aria-label',n+' estrelas ganhas de '+Q.length);
}

function renderQ(){
  var q=Q[state.i];
  state.tries=0; state.solved=false; state.fb='';
  stopSpeak();
  $('#scene').innerHTML=svgBox(q.scene(),q.alt);
  $('#kicker').textContent='Aventura '+(state.i+1)+' de '+Q.length;
  $('#who').textContent=q.who;
  $('#situation').textContent=q.text;
  state.order=shuffle(q.opts.map(function(_,k){return k;}));
  $('#options').innerHTML=state.order.map(function(k,pos){
    var o=q.opts[k];
    return '<button type="button" class="opt c'+pos+'" data-k="'+k+'"><span class="ico"><svg viewBox="0 0 64 64" aria-hidden="true">'+ICON[o.icon]+'</svg></span><span>'+o.label+'</span></button>';
  }).join('');
  var fb=$('#feedback'); fb.hidden=true; fb.innerHTML=''; fb.className='';
  renderStars();
  show('play');
  var who=$('#who'); try{who.focus({preventScroll:true});}catch(e){}
}

function pick(k,btn){
  if(state.solved) return;
  var q=Q[state.i], o=q.opts[k];
  state.tries++;
  var all=Array.prototype.slice.call(document.querySelectorAll('#options .opt'));
  if(o.ok){
    state.solved=true;
    state.res[state.i]=state.tries===1?'first':'retry';
    all.forEach(function(b){b.disabled=true; if(b!==btn&&!b.classList.contains('is-wrong')) b.classList.add('is-other');});
    btn.classList.add('is-right');
    btn.insertAdjacentHTML('beforeend',GOOD+'<span class="sr"> Resposta certa.</span>');
    renderStars();
    showFeedback(true,o.why,q.tip);
    confetti();
  } else {
    btn.classList.add('is-wrong'); btn.disabled=true;
    btn.insertAdjacentHTML('beforeend',BAD+'<span class="sr"> Não foi essa.</span>');
    showFeedback(false,o.why);
    var nx=document.querySelector('#options .opt:not(:disabled)'); if(nx){try{nx.focus({preventScroll:true});}catch(e){}}
  }
}

function showFeedback(ok,text,tip){
  var f=$('#feedback'), last=state.i===Q.length-1;
  var head=ok?PRAISE[state.i%PRAISE.length]:'Vamos tentar outra vez!';
  state.fb=head+' '+text+(ok?' Dica de respeito: '+tip:'');
  f.hidden=false; f.className='feedback '+(ok?'ok':'try');
  f.innerHTML='<div class="fb-head"><span class="fb-ico">'+(ok?CHECK:THINK)+'</span><h3>'+head+'</h3></div>'+
    '<p>'+text+'</p>'+
    (ok?'<p class="tip"><b>Dica de respeito:</b> '+tip+'</p>':'')+
    '<div class="fb-actions">'+
      (ok?'<button type="button" class="btn" id="next">'+(last?'Ver resultado':'Próxima aventura')+'</button>':'')+
      '<button type="button" class="chip" data-say="fb">'+SPEAKER+'Ouvir</button></div>';
  try{f.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});}catch(e){}
  if(ok){var n=$('#next'); if(n){try{n.focus({preventScroll:true});}catch(e){}}}
}

function begin(){state.i=0;state.res=[];renderQ();}
function next(){
  state.i++;
  if(state.i>=Q.length){renderEnd();show('end');var t=$('#endTitle');try{t.focus({preventScroll:true});}catch(e){}}
  else renderQ();
}

function renderEnd(){
  stopSpeak();
  var n=state.res.filter(function(r){return r==='first';}).length;
  var msg=n>=6?'Campeão da inclusão!':n>=4?'Você ajudou muito bem!':'Boa jogada! Vamos de novo?';
  state.endText=msg+' Você ajudou os '+Q.length+' amigos e acertou '+n+' de primeira.';
  $('#endTitle').textContent=msg;
  $('#endText').textContent='Você ajudou os '+Q.length+' amigos e acertou '+n+' de primeira.';
  var bs=$('#bigStars');
  bs.innerHTML=Q.map(function(_,k){return '<span class="star '+(state.res[k]==='first'?'got':'done')+'">'+STAR+'</span>';}).join('');
  bs.setAttribute('aria-label',n+' estrelas de '+Q.length);
  $('#tools').innerHTML=Q.map(function(q){
    return '<li class="tool"><span class="ico"><svg viewBox="0 0 64 64" aria-hidden="true">'+ICON[q.tool.icon]+'</svg></span><div><b class="t-name">'+q.tool.name+'</b><span class="t-desc">'+q.tool.desc+'</span></div></li>';
  }).join('');
}

function confetti(){
  if(reduced()) return;
  var box=$('#confetti'); box.innerHTML='';
  var cols=[SUN,CORAL,BLUE,GRASS,GRAPE];
  for(var k=0;k<24;k++){
    var s=document.createElement('i');
    s.style.left=(Math.random()*100)+'%';
    s.style.background=cols[k%cols.length];
    s.style.animationDelay=(Math.random()*.3)+'s';
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    box.appendChild(s);
  }
  setTimeout(function(){box.innerHTML='';},2000);
}

/* ---------- read aloud ---------- */
var tts=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
if(!tts) document.documentElement.classList.add('no-tts');
function stopSpeak(){try{if(tts) window.speechSynthesis.cancel();}catch(e){}}
function speak(t){
  if(!tts) return;
  try{
    var syn=window.speechSynthesis; syn.cancel();
    var u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; u.rate=.92;
    var v=(syn.getVoices()||[]).filter(function(x){return /^pt/i.test(x.lang);})[0]; if(v) u.voice=v;
    syn.speak(u);
  }catch(e){}
}
function sayText(kind){
  if(kind==='intro') return 'Jogo da Inclusão. Sete amigos precisam da sua ajuda. Escolha a melhor forma de ajudar cada um. Errou? Sem problema, é só tentar outra vez.';
  if(kind==='fb') return state.fb;
  if(kind==='end') return state.endText||'';
  var q=Q[state.i];
  return q.who+'. '+q.text+' Como você ajuda? '+state.order.map(function(k,n){return 'Opção '+(n+1)+': '+q.opts[k].label.replace(/[“”]/g,'')+'.';}).join(' ');
}

/* ---------- wiring ---------- */
$('#heroArt').innerHTML=svgBox(sceneHero(),'Cinco crianças sorrindo no pátio da escola. Uma usa cadeira de rodas, uma usa bengala branca e as outras acenam.');
document.addEventListener('click',function(e){
  var say=e.target.closest('[data-say]'); if(say){speak(sayText(say.getAttribute('data-say')));return;}
  var opt=e.target.closest('button.opt'); if(opt&&!opt.disabled){pick(parseInt(opt.getAttribute('data-k'),10),opt);return;}
  if(e.target.closest('#go')||e.target.closest('#again')){begin();return;}
  if(e.target.closest('#next')){next();return;}
});
})();
</script>
